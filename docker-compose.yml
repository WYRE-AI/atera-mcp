services:
  # Gateway mode. The Atera API key arrives per request on X-Atera-API-Key.
  # Do not set ATERA_API_KEY or env_file here — that would put a static vendor
  # credential in the container. Compose interpolates CONDUIT_S2S_SECRET from
  # the project .env. For AUTH_MODE=env, pass ATERA_API_KEY on that process
  # instead (see the README).
  atera-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: atera-mcp:latest
    container_name: atera-mcp-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Transport configuration. 0.0.0.0 is the interface inside the container.
      # The port publish above stays on loopback. Startup still refuses to run
      # without a real CONDUIT_S2S_SECRET.
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}

      # Logging configuration
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - NODE_ENV=production
    volumes:
      # Mount logs directory for persistence
      - atera-mcp-logs:/app/logs

    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Resource limits for production use
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

volumes:
  atera-mcp-logs:
    driver: local
